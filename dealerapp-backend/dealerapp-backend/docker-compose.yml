services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL_CA_BUNDLE: ${DB_SSL_CA_BUNDLE:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_VOICE_BUCKET: ${S3_VOICE_BUCKET:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SNS_SMS_ENABLED: ${SNS_SMS_ENABLED:-false}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-true}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      # Bypasses Cognito locally: send `X-Dev-User: <sub>:DEALER_STAFF` (or
      # `:CUSTOMER`) instead of a real bearer token. Never enable in prod.
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./scripts:/srv/scripts
      - ./global-bundle.pem:/srv/global-bundle.pem:ro
    # AWS calls (boto3) still need real credentials if you exercise Cognito/S3/
    # SES/SNS/Bedrock locally - mount ~/.aws or export AWS_* env vars as usual.
